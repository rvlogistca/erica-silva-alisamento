<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Keity Beauty — Antes e Depois</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fff9ee, #f8efdc);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #5c3a21;
            font-size: 26px;
            margin-bottom: 35px;
            font-weight: 700;
        }
        #btnAntesDepois {
            padding: 15px 40px;
            background: linear-gradient(135deg, #b8860b, #ffcc00);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(184, 134, 11, 0.35);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 340px;
            display: block;
            margin: 0 auto;
        }
        #btnAntesDepois:hover {
            transform: scale(1.04);
            box-shadow: 0 7px 22px rgba(184, 134, 11, 0.45);
        }
        #secaoAntesDepois {
            display: none;
            margin-top: 35px;
            animation: aparecer 0.4s ease;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .antes-depois {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .img-box {
            flex: 1;
            min-width: 280px;
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }
        .img-box span {
            display: block;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .antes {
            color: #8b4513;
        }
        .depois {
            color: #26a179;
        }
        .img-box img {
            width: 100%;
            border-radius: 12px;
            height: auto;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Transformação dos Fios ✨</h2>

    <button id="btnAntesDepois">
        Ver Antes e Depois 👁️
    </button>

    <div id="secaoAntesDepois">
        <div class="antes-depois">
            <div class="img-box">
                <span class="antes">ANTES</span>
                <img src="antes3.jpg" alt="Cabelo antes — ressecado e crespo">
            </div>
            <div class="img-box">
                <span class="depois">DEPOIS</span>
                <img src="depois3.jpg" alt="Cabelo depois — liso e brilhante">
            </div>
        </div>
    </div>
</div>

<script>
const botao = document.getElementById('btnAntesDepois');
const secao = document.getElementById('secaoAntesDepois');
let aberto = false;

botao.addEventListener('click', () => {
    aberto = !aberto;
    secao.style.display = aberto ? 'block' : 'none';
    botao.textContent = aberto ? 'Fechar ❌' : 'Ver Antes e Depois 👁️';
});
</script>

</body>
</html>
