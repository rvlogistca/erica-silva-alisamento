<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Abrir Opções</title>
    <style>
        /* Estilo do Botão */
        .btn-opcao {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.3s ease;
        }

        .btn-opcao:hover {
            transform: scale(1.05);
        }

        /* Estilo da Caixa de Opções (Escondida por padrão) */
        .menu-opcoes {
            display: none; 
            margin-top: 15px;
            padding: 20px;
            border-radius: 12px;
            background-color: #1a1a1a;
            border: 1px solid #ff4081;
            width: 260px;
        }

        .menu-opcoes p {
            color: white;
            margin: 12px 0;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .menu-opcoes p:hover {
            background-color: #ff4081;
        }

        .menu-opcoes hr {
            border: none;
            border-top: 1px solid #ff4081;
            margin: 10px 0;
        }

        .menu-opcoes strong {
            color: #ff4081;
        }

        /* Classe que o JavaScript vai ativar para mostrar o menu */
        .mostrar {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Botão que o usuário clica -->
    <button class="btn-opcao" onclick="alternarMenu()">☰ ABRIR OPÇÕES</button>

    <!-- Caixa com as opções que será aberta -->
    <div id="meuMenu" class="menu-opcoes">
        <p><strong>Escolha uma opção:</strong></p>
        <hr>
        <p>💬 WhatsApp</p>
        <p>📸 Instagram</p>
        <p>💇‍♀️ Nossos Serviços</p>
        <p>📸 Resultados</p>
    </div>

    <script>
        // Função que abre e fecha as opções
        function alternarMenu() {
            var menu = document.getElementById("meuMenu");
            menu.classList.toggle("mostrar");
        }
    </script>

</body>
</html>
