<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10070d">
<meta property="og:title" content="Érika Silva | Alisamento Progressivo">
<meta property="og:description" content="Atendimento capilar personalizado em Cascavel – PR. Entre em contato e agende seu horário.">
<meta name="color-scheme" content="dark">
<meta name="description" content="Érica Silva — Alisamento progressivo em Cascavel, Paraná. Cabelos alinhados, brilho e cuidado personalizado.">
<title>Érica Silva | Alisamento Progressivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10070d;--panel:#1b0c16;--pink:#ff5ca8;--rose:#f38aba;--gold:#e8bdc9;--text:#fff2f8;--muted:#c3a6b4;--line:#74344f80}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{min-height:100vh;color:var(--text);font-family:"DM Sans",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 25%,#42172e 0%,#210d19 35%,var(--bg) 75%);overflow-x:hidden}
a{color:inherit}.page{width:min(1180px,100%);margin:auto;padding:24px 22px 36px}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{width:48px;height:48px;border:2px solid var(--pink);border-radius:50%;display:grid;place-items:center;color:var(--pink);box-shadow:0 0 22px #ff5ca844,inset 0 0 18px #ff5ca822}.brand-mark{width:64px;height:64px;flex:0 0 64px;overflow:hidden;border:1px solid var(--pink);box-shadow:0 0 22px #ff5ca844}.brand-mark img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
.brand-name{font-size:clamp(19px,3vw,27px);font-weight:750;letter-spacing:-.7px}.brand-name span{color:var(--pink)}.brand-sub{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
nav{display:flex;align-items:center;gap:19px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}nav a:hover{color:var(--pink)}
.status{color:#ffc1dc;font-size:10px;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:7px}.status:before{content:"";width:7px;height:7px;background:var(--pink);border-radius:50%;box-shadow:0 0 8px var(--pink)}
.hero{text-align:center;margin:48px auto 0;max-width:820px}.eyebrow{color:var(--pink);font-size:11px;letter-spacing:3px;text-transform:uppercase}
.hero h1{font:600 clamp(34px,6vw,64px)/1.05 "Playfair Display",serif;letter-spacing:-1px;margin:16px 0}.hero h1 span{color:var(--pink);font-style:italic}
.hero p{color:#d5b8c6;line-height:1.8;font-size:15px;margin:auto;max-width:640px}
.hero-photo{width:min(100%,720px);height:clamp(260px,55vw,480px);margin:30px auto 0;position:relative;border:1px solid #ff5ca855;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px #0007}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 37%;display:block;filter:saturate(.9)}
.hero-photo:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#10070de8)}
.photo-label{position:absolute;z-index:1;bottom:23px;left:25px;text-align:left}.photo-label span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#ffc1dc}.photo-label strong{display:block;font:500 clamp(21px,4vw,31px) "Playfair Display",serif;margin-top:5px}
.cta-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--pink);border-radius:999px;padding:14px 23px;color:#210b17;background:var(--pink);font-weight:750;text-decoration:none;font-size:13px;box-shadow:0 0 25px #ff5ca126;transition:.25s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 35px #ff5ca140}.btn.secondary{background:transparent;color:var(--text);border-color:#8a4867;box-shadow:none}.btn.secondary:hover{border-color:var(--pink);color:var(--pink)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:34px 0 27px}.legend-item{padding:18px 14px;border:1px solid var(--line);border-radius:16px;background:#1a0b16d9;transition:.25s}.legend-item:hover{border-color:#ff5ca877;transform:translateY(-3px)}.legend-icon{color:var(--pink);width:24px;height:24px}.legend-item b{display:block;font-size:13px;margin:8px 0 5px}.legend-item span{color:var(--muted);font-size:12px;line-height:1.5}
section.block{max-width:900px;margin:68px auto 0;text-align:center}section.block h2{font:600 clamp(27px,4vw,38px)/1.2 "Playfair Display",serif;margin-bottom:14px}section.block>p{color:var(--muted);line-height:1.8;font-size:15px}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px;text-align:left}.feature-card{padding:22px 20px;border:1px solid var(--line);border-radius:16px;background:#1a0b16d9}.feature-card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:10px}.feature-card h3 span{color:var(--pink);font-size:19px}.feature-card p{color:var(--muted);font-size:13px;line-height:1.7}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}.pillar{padding:24px 18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#291020,#150811)}.pillar .num{color:var(--pink);font-size:13px;letter-spacing:2px;font-weight:700;margin-bottom:10px}.pillar h3{font:500 20px "Playfair Display",serif;margin-bottom:8px}.pillar p{color:var(--muted);font-size:13px;line-height:1.7}
.profile{display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;align-items:center;text-align:left;margin-top:30px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#1a0b16b8}.profile-img{width:100%;height:370px;object-fit:cover;object-position:center 20%;border-radius:14px;border:1px solid #ff5ca833}.profile h3{font:500 30px "Playfair Display",serif;margin-bottom:10px}.profile p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:10px}.profile strong{color:var(--text)}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}.gallery-card{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#1a0b16}.gallery-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.gallery-card:hover img{transform:scale(1.04)}.gallery-card:first-child{grid-row:span 2;height:616px}.gallery-caption{color:var(--muted);font-size:12px;margin-top:14px}
.disclaimer{max-width:760px;margin:42px auto 0;text-align:center;padding:16px 20px;border:1px solid #74344f55;border-radius:12px;background:#150811aa}.disclaimer p{color:#aa8496;font-size:12px;line-height:1.7}
footer{text-align:center;color:#9a7185;font-size:12px;margin-top:55px;padding-top:25px;border-top:1px solid #472035;line-height:2}footer a{color:var(--muted)}.copyright{opacity:.7}
@media(max-width:850px){nav{gap:12px}.status{display:none}.legend{grid-template-columns:repeat(2,1fr)}.pillars{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.profile-img{height:340px;object-position:center 25%}}
@media(max-width:600px){.page{padding:18px 14px 28px}header{align-items:flex-start}.brand-sub{letter-spacing:1.1px;font-size:8px}nav{width:100%;padding-top:7px;gap:14px}nav a{font-size:12px}.hero{margin-top:34px}.hero p{font-size:14px}.hero-photo{border-radius:15px}.photo-label{left:17px;bottom:17px}.legend{gap:9px}.legend-item{padding:14px 11px}.features{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-card,.gallery-card:first-child{height:280px;grid-row:auto}.profile{padding:14px}section.block{margin-top:54px}.btn{width:100%;max-width:340px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

/* Refinamento visual e acessibilidade */
:root{--pink:#ff6bad;--rose:#f4a1c8;--gold:#d9b47a;--line:rgba(255,107,173,.22)}
html{scroll-padding-top:110px}
body{background:radial-gradient(ellipse at 50% 0%,#43162d 0%,#210d19 38%,#0c060b 82%)}
.page{width:min(1220px,100%)}
header{position:sticky;top:0;padding:12px 0;background:rgba(16,7,13,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,107,173,.12)}
.brand{min-width:220px}
.brand-mark{width:72px;height:72px;flex:0 0 72px;border:2px solid #d9b47a;box-shadow:0 0 0 4px rgba(255,107,173,.10),0 0 28px rgba(255,92,168,.22)}
.brand-mark img{object-fit:cover}
.brand-name{letter-spacing:.2px}
.brand-sub{line-height:1.5;letter-spacing:1.4px}
nav a{padding:9px 0;position:relative}
nav a:after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--pink);transition:right .22s}
nav a:hover:after,nav a:focus-visible:after{right:0}
.hero{margin-top:58px}
.hero h1{line-height:1.08;text-wrap:balance}
.hero p,section.block>p{max-width:680px;margin-left:auto;margin-right:auto}
.hero-photo{width:min(100%,820px);height:clamp(300px,58vw,540px);border-radius:26px;border-color:rgba(217,180,122,.48);box-shadow:0 30px 85px rgba(0,0,0,.45),0 0 0 1px rgba(255,107,173,.08)}
.hero-photo img{object-position:center 32%;transition:transform .8s ease}
.hero-photo:hover img{transform:scale(1.025)}
.btn{min-height:48px;padding:14px 25px;letter-spacing:.1px}
.btn.secondary{border-color:rgba(217,180,122,.48);color:#fff2f8;background:rgba(255,255,255,.025)}
.btn.secondary:hover{border-color:var(--pink);background:rgba(255,107,173,.08)}
.legend-item,.feature-card,.pillar,.profile{box-shadow:0 12px 36px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
.legend-item{min-height:150px}
.legend-item b{font-size:14px}
.feature-card,.pillar{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.feature-card:hover,.pillar:hover{transform:translateY(-4px);border-color:rgba(255,107,173,.55);box-shadow:0 18px 38px rgba(0,0,0,.2)}
section.block{margin-top:78px}
section.block h2{ text-wrap:balance }
.profile{padding:24px;border-color:rgba(217,180,122,.22)}
.profile-img{object-position:center 22%;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.gallery-card{position:relative;border-color:rgba(217,180,122,.25);box-shadow:0 15px 38px rgba(0,0,0,.22)}
.gallery-card:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(16,7,13,.28));pointer-events:none}
.disclaimer{border-color:rgba(217,180,122,.2)}
footer{border-top-color:rgba(255,107,173,.2)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:5px}
@media(max-width:850px){header{position:relative;padding:0 0 12px;background:transparent;backdrop-filter:none;border-bottom:0}.brand-mark{width:60px;height:60px;flex-basis:60px}.hero{margin-top:38px}section.block{margin-top:60px}}
@media(max-width:600px){.brand{gap:10px}.brand-mark{width:56px;height:56px;flex-basis:56px}.brand-name{font-size:22px}.brand-sub{max-width:210px;font-size:8px}.hero-photo{height:360px;border-radius:18px}.legend-item{min-height:140px}.gallery-card,.gallery-card:first-child{height:300px}.cta-row{gap:10px}.btn{width:100%;max-width:360px}.profile{padding:14px}}
@media(prefers-reduced-motion:reduce){.hero-photo img,.feature-card,.pillar,.btn,nav a:after{transition:none!important}}

</style>
</head>
